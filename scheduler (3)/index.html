<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/task2goal-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="Task2Goal - Smart planner for everyday life" />
    <meta name="apple-mobile-web-app-title" content="Task2Goal - Smart planner for everyday life" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-TileImage" content="/task2goal-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/task2goal-icon.svg" />
    <link rel="mask-icon" href="/task2goal-icon.svg" color="#20BF5A" />
    <script>
      (function () {
        try {
          const theme = window.localStorage.getItem('chronos_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            if (document.documentElement) document.documentElement.style.colorScheme = 'dark';
            if (document.body) {
              document.body.style.backgroundColor = '#111827';
              document.body.style.color = '#f8fafc';
            }
          } else {
            document.documentElement.classList.remove('dark');
            if (document.documentElement) document.documentElement.style.colorScheme = 'light';
            if (document.body) {
              document.body.style.backgroundColor = '#ffffff';
              document.body.style.color = '#111827';
            }
          }
        } catch (error) {
          console.warn('Theme preload failed', error);
        }
      })();
    </script>
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        background: #ffffff;
        color: #0f172a;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.6s ease, visibility 0.6s ease;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #splash-screen.visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      #splash-screen.hide {
        opacity: 0;
        visibility: hidden;
      }
      body.splash-hidden #root {
        visibility: hidden;
      }
      .splash-screen__content {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        max-width: min(90vw, 380px);
      }
      .splash-screen__logo {
        width: 90px;
        height: 90px;
        border-radius: 24px;
        background: #f8fafc;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      }
      .splash-screen__logo img {
        width: 60%;
        height: auto;
      }
      .splash-screen__title {
        font-size: clamp(2rem, 8vw, 4rem);
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin: 0;
        line-height: 1.05;
        color: #111827;
      }
      .splash-screen__subtitle {
        opacity: 0.76;
        margin: 0;
        font-size: clamp(1rem, 3vw, 1.2rem);
        letter-spacing: 0.02em;
        max-width: 320px;
      }
    </style>
    <title>Task2Goal - Smart planner for everyday life</title>
  </head>
  <body class="splash-hidden">
    <div id="root"></div>
    <div id="splash-screen" class="splash-screen visible">
      <div class="splash-screen__content">
        <div class="splash-screen__logo">
          <img src="/task2goal-logo.svg" alt="Task2Goal logo" />
        </div>
        <h1 class="splash-screen__title">Task2Goal</h1>
        <p class="splash-screen__subtitle">Smart planner for everyday life</p>
      </div>
    </div>
    <script>
      const splash = document.getElementById('splash-screen');
      if (splash) {
        const customSplashDuration = 3000;

        function hideSplash() {
          splash.classList.add('hide');
          splash.addEventListener(
            'transitionend',
            () => {
              splash.remove();
              document.body.classList.remove('splash-hidden');
            },
            { once: true }
          );
        }

        splash.classList.add('visible');
        splash.classList.remove('hide');

        window.setTimeout(hideSplash, customSplashDuration);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
