<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          const theme = window.localStorage.getItem('chronos_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            document.body.style.backgroundColor = '#111827';
            document.body.style.color = '#f8fafc';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
            document.body.style.backgroundColor = '#ffffff';
            document.body.style.color = '#111827';
          }
        } catch (error) {
          console.warn('Theme preload failed', error);
        }
      })();
    </script>
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        background: #ffffff;
        color: #0f172a;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.6s ease, visibility 0.6s ease;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #splash-screen.visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      #splash-screen.hide {
        opacity: 0;
        visibility: hidden;
      }
      body.splash-hidden #root {
        visibility: hidden;
      }
      .splash-screen__content {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        max-width: min(90vw, 380px);
      }
      .splash-screen__logo {
        width: 90px;
        height: 90px;
        border-radius: 24px;
        background: #f8fafc;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      }
      .splash-screen__logo img {
        width: 60%;
        height: auto;
      }
      .splash-screen__title {
        font-size: clamp(2rem, 8vw, 4rem);
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin: 0;
        line-height: 1.05;
        color: #111827;
      }
      .splash-screen__subtitle {
        opacity: 0.76;
        margin: 0;
        font-size: clamp(1rem, 3vw, 1.2rem);
        letter-spacing: 0.02em;
        max-width: 320px;
      }
    </style>
    <title>Scheduler — Professional Weekly Planner</title>
  </head>
  <body class="splash-hidden">
    <div id="root"></div>
    <div id="splash-screen" class="splash-screen">
      <div class="splash-screen__content">
        <div class="splash-screen__logo">
          <img src="/favicon.svg" alt="Scheduler logo" />
        </div>
        <h1 class="splash-screen__title">Scheduler</h1>
        <p class="splash-screen__subtitle">Smart planner for every day</p>
      </div>
    </div>
    <script>
      window.addEventListener('load', () => {
        const splash = document.getElementById('splash-screen');
        if (!splash) return;

        const customSplashDuration = 3000;
        const nativeTransitionBuffer = window.matchMedia('(max-width: 768px)').matches ? 1200 : 300;

        function hideSplash() {
          splash.classList.add('hide');
          splash.addEventListener(
            'transitionend',
            () => {
              splash.remove();
              document.body.classList.remove('splash-hidden');
            },
            { once: true }
          );
        }

        // Delay custom splash appearance so the default mobile PWA splash can finish.
        setTimeout(() => {
          splash.style.transition = 'none';
          splash.classList.add('visible');
          splash.classList.remove('hide');

          requestAnimationFrame(() => {
            splash.style.transition = 'opacity 0.6s ease, visibility 0.6s ease';
          });

          window.setTimeout(hideSplash, customSplashDuration);
        }, nativeTransitionBuffer);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
