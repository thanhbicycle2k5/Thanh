<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          const theme = window.localStorage.getItem('chronos_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            document.body.style.backgroundColor = '#111827';
            document.body.style.color = '#f8fafc';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
            document.body.style.backgroundColor = '#ffffff';
            document.body.style.color = '#111827';
          }
        } catch (error) {
          console.warn('Theme preload failed', error);
        }
      })();
    </script>
    <title>Scheduler — Professional Weekly Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash-screen" class="splash-screen">
      <div class="splash-screen__content">
        <h1 class="splash-screen__title">Scheduler</h1>
        <p class="splash-screen__subtitle">by ThànhBicycle</p>
      </div>
    </div>
    <script>
      window.addEventListener('load', () => {
        const splash = document.getElementById('splash-screen');
        if (!splash) return;
        window.setTimeout(() => {
          splash.classList.add('hide');
          splash.addEventListener('transitionend', () => splash.remove(), { once: true });
        }, 1000);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
